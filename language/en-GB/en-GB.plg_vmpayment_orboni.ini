PLG_VMPAYMENT_ORBONI="VM Payment - Orboni"
PLG_VMPAYMENT_ORBONI_XML_DESCRIPTION="Crypto payments for VirtueMart through Orboni: buyers pay with USDT, USDC, BTC, ETH and other coins on Orboni’s payment page, and the money goes straight to your own wallets — Orboni never holds it. After installing, create a payment method under VirtueMart → Payment Methods and choose “VM Payment - Orboni”."

; Settings
PLG_VMPAYMENT_ORBONI_SECRET_KEY="Secret key"
PLG_VMPAYMENT_ORBONI_SECRET_KEY_TIP="In your Orboni dashboard, under Developers → API keys. A test key (sk_test_…) to try it, a live key (sk_live_…) for real payments."
PLG_VMPAYMENT_ORBONI_WEBHOOK_SECRET="Webhook signing secret"
PLG_VMPAYMENT_ORBONI_WEBHOOK_SECRET_TIP="In your Orboni dashboard, under Developers → Webhooks, add an endpoint with the webhook address shown below and paste its signing secret (whsec_…) here. Without it orders are marked paid when the buyer comes back to your store or when the cron address runs."
PLG_VMPAYMENT_ORBONI_ADDRESSES="Addresses"
PLG_VMPAYMENT_ORBONI_WEBHOOK_URL="Webhook address"
PLG_VMPAYMENT_ORBONI_WEBHOOK_URL_TIP="Add it as an endpoint in your Orboni dashboard, under Developers → Webhooks."
PLG_VMPAYMENT_ORBONI_CRON_URL="Cron address"
PLG_VMPAYMENT_ORBONI_CRON_URL_TIP="Reads back payments still on their way, in case a webhook was lost. Add it under System → Scheduled Tasks as a “GET Request” task every 15 minutes, or call it from your server’s cron."
PLG_VMPAYMENT_ORBONI_CRON_URL_SAVE_FIRST="Save the secret key first: the cron address is made from it."
