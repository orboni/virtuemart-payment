PLG_VMPAYMENT_ORBONI_STATUS_SUCCESS="Order status when paid"
PLG_VMPAYMENT_ORBONI_STATUS_SUCCESS_TIP="The status an order takes once Orboni has seen the full payment confirmed on the chain."
